## CI Pipeline
## File description:
## GitHub Actions workflow for Epitech Zappy project
##

name: CI Pipeline

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, dev]

env:
  MIRROR_URL: ${{ vars.MIRROR_URL }}
  # zappy_gui exclu : raylib absente du container Epitech
  EXECUTABLES: "zappy_server zappy_ai"

jobs:
  check-repo:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check repository origin
        id: check
        run: |
          echo "Current repo: ${{ github.repository }}"
          if [[ "${{ github.repository }}" == *"/local-zappy" ]]; then
            echo "✓ Running on local-zappy repo"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏭  Running on Epitech mirror, skipping build"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build-test-mirror:
    needs: check-repo
    if: needs.check-repo.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile project with Make
        run: |
          echo "Build..."
          make zappy_server zappy_ai

          for exe in ${{ env.EXECUTABLES }}; do
            if [ ! -f "$exe" ]; then
              echo "❌ Échec : l'exécutable $exe n'a pas été créé"
              exit 1
            fi
            if [ ! -x "$exe" ]; then
              echo "❌ Échec : $exe n'est pas exécutable"
              exit 1
            fi
            echo "✓ $exe OK"
          done
          echo "✓ Compilation OK"

      - name: Mirror to Epitech repository
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          target_repo_url: ${{ env.MIRROR_URL }}
